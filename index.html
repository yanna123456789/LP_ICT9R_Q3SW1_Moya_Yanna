<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
        }
        h1, p {
            text-align: center;
        }
        .currency-output {
            margin-top: 20px;
            text-align: center;
        }
        .btn {
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>100 Pesos Currency Converter</h1>
        <p>Convert 100 PHP into Dollar, Yen, Euro, Pound, or Baht.</p>

        <!-- Buttons for currency -->
        <div class="text-center">
            <button class="btn btn-outline-light" onclick="convertCurrency('USD')">Convert to Dollar</button>
            <button class="btn btn-outline-light" onclick="convertCurrency('YEN')">Convert to Yen</button>
            <button class="btn btn-outline-light" onclick="convertCurrency('EUR')">Convert to Euro</button>
            <button class="btn btn-outline-light" onclick="convertCurrency('POUND')">Convert to Pound</button>
            <button class="btn btn-outline-light" onclick="convertCurrency('BAHT')">Convert to Baht</button>
        </div>

        <!-- Output Section -->
        <div id="output" class="currency-output"></div>
    </div>

    <!-- JavaScript -->
    <script>
        // Conversion rates (as of a recent date; update rates as needed)
        const rates = {
            USD: 0.018, // Philippine Peso to US Dollar
            YEN: 2.44,  // Philippine Peso to Japanese Yen
            EUR: 0.016, // Philippine Peso to Euro
            POUND: 0.014, // Philippine Peso to Pound Sterling
            BAHT: 0.63   // Philippine Peso to Thai Baht
        };

        // Function to convert PHP to a selected currency
        function convertCurrency(currency) {
            let pesos = 100; // Base value in PHP
            let converted = pesos * rates[currency]; // Conversion using selected rate

            // Displaying results using innerHTML
            const outputDiv = document.getElementById("output");
            outputDiv.innerHTML = `
                <p>100 Pesos is approximately:</p>
                <h3>${converted.toFixed(2)} ${currency}</h3>
            `;
        }

        
    </script>
</body>
</html>
